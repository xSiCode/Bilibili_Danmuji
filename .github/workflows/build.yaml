name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # 只在 Linux 上编译一次 JAR（JAR 本身跨平台通用）
  build-jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E "^\s*version\s*=" build.gradle | head -1 | sed "s/.*version[[:space:]]*=[[:space:]]*['\"]\?//;s/['\"].*//")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili_Danmuji-${{ steps.version.outputs.version }}.jar
          path: build/libs/BiliBili_Danmuji-${{ steps.version.outputs.version }}.jar

      - name: Upload dist (requires system Java)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIST="dist/BiliBili_Danmuji_${VERSION}"
          mkdir -p "${DIST}"
          cp "build/libs/BiliBili_Danmuji-${VERSION}.jar" "${DIST}/"

          # Windows 脚本
          cat > "${DIST}/run.bat" << 'EOF'
          @echo off
          title BiliBili_Danmuji
          java -jar -Xms64m -Xmx128m BiliBili_Danmuji-*.jar --server.port=23333
          pause
          EOF

          # Linux/Mac 脚本
          cat > "${DIST}/run.sh" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          java -jar -Xms64m -Xmx128m "${DIR}"/BiliBili_Danmuji-*.jar --server.port=23333
          EOF
          chmod +x "${DIST}/run.sh"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili_Danmuji_${{ steps.version.outputs.version }}
          path: dist/BiliBili_Danmuji_${{ steps.version.outputs.version }}/

  # 在各平台上用 jlink 生成原生 JRE，打包便携版
  package-portable:
    needs: build-jar
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            suffix: linux
          - os: windows-latest
            suffix: windows
          - os: macos-latest
            suffix: macos
    steps:
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: BiliBili_Danmuji-${{ needs.build-jar.outputs.version }}.jar

      - name: Create platform JRE via jlink
        shell: bash
        run: |
          VERSION="${{ needs.build-jar.outputs.version }}"
          JAR="BiliBili_Danmuji-${VERSION}.jar"

          # 分析 fat JAR 的 module 依赖
          MODS=$(jdeps --ignore-missing-deps --print-module-deps --multi-release 11 -q "${JAR}" 2>/dev/null || true)
          if [ -z "${MODS}" ]; then
            # jdeps 对 fat JAR 分析可能失败，用 Spring Boot 常用模块
            MODS="java.base,java.desktop,java.management,java.naming,java.security.jgss,java.sql,java.xml,jdk.unsupported,java.instrument,java.compiler"
          fi
          echo "JRE modules: ${MODS}"

          jlink \
            --no-header-files \
            --no-man-pages \
            --compress=1 \
            --strip-debug \
            --add-modules "${MODS}" \
            --output jre

          echo "JRE size:"
          du -sh jre/ 2>/dev/null || ls -la jre/

      - name: Package portable (Linux / Mac)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.build-jar.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          PORTABLE="BiliBili_Danmuji_${VERSION}_${SUFFIX}"
          mkdir -p "${PORTABLE}"
          cp "BiliBili_Danmuji-${VERSION}.jar" "${PORTABLE}/"
          cp -r jre "${PORTABLE}/jre"

          cat > "${PORTABLE}/run.sh" << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          "${DIR}"/jre/bin/java -jar -Xms64m -Xmx128m "${DIR}"/BiliBili_Danmuji-*.jar --server.port=23333
          EOF
          chmod +x "${PORTABLE}/run.sh"

      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ needs.build-jar.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          PORTABLE="BiliBili_Danmuji_${VERSION}_${SUFFIX}"
          mkdir -p "${PORTABLE}"
          cp "BiliBili_Danmuji-${VERSION}.jar" "${PORTABLE}/"
          cp -r jre "${PORTABLE}/jre"

          cat > "${PORTABLE}/run.bat" << 'EOF'
          @echo off
          title BiliBili_Danmuji
          jre\bin\java -jar -Xms64m -Xmx128m BiliBili_Danmuji-*.jar --server.port=23333
          pause
          EOF

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili_Danmuji_${{ needs.build-jar.outputs.version }}_${{ matrix.suffix }}
          path: BiliBili_Danmuji_${{ needs.build-jar.outputs.version }}_${{ matrix.suffix }}/
