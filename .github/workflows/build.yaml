name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -E "^\s*version\s*=" build.gradle | head -1 | sed "s/.*version[[:space:]]*=[[:space:]]*['\"]\?//;s/['\"].*//")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Determine required JRE modules via jdeps
        id: jdeps
        run: |
          JAR=$(ls build/libs/BiliBili_Danmuji-*.jar | grep -v plain)
          echo "jar=${JAR}" >> $GITHUB_OUTPUT
          # 分析 fat JAR 依赖的 JDK 模块
          MODS=$(jdeps --ignore-missing-deps --print-module-deps --multi-release 11 -q "${JAR}" 2>/dev/null || true)
          if [ -z "${MODS}" ]; then
            # jdeps 分析失败时使用 Spring Boot 常用模块集合
            MODS="java.base,java.desktop,java.management,java.naming,java.security.jgss,java.sql,java.xml,jdk.unsupported,java.instrument,java.compiler"
          fi
          echo "modules=${MODS}" >> $GITHUB_OUTPUT
          echo "JRE modules: ${MODS}"

      - name: Create minimal JRE via jlink (portable)
        run: |
          MODS="${{ steps.jdeps.outputs.modules }}"
          jlink \
            --no-header-files \
            --no-man-pages \
            --compress=2 \
            --strip-debug \
            --add-modules "${MODS}" \
            --output dist/jre

      - name: Package dist (requires system Java)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          JAR="${{ steps.jdeps.outputs.jar }}"
          DIST="dist/BiliBili_Danmuji_${VERSION}"
          mkdir -p "${DIST}"

          cp "${JAR}" "${DIST}/"

          # Windows 启动脚本
          cat > "${DIST}/run.bat" << 'BATEOF'
          @echo off
          title BiliBili_Danmuji
          java -jar -Xms64m -Xmx128m BiliBili_Danmuji-*.jar --server.port=23333
          pause
          BATEOF

          # Linux/Mac 启动脚本
          cat > "${DIST}/run.sh" << 'SHEOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          java -jar -Xms64m -Xmx128m "${DIR}"/BiliBili_Danmuji-*.jar --server.port=23333
          SHEOF
          chmod +x "${DIST}/run.sh"

      - name: Package portable dist (bundled minimal JRE)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          JAR="${{ steps.jdeps.outputs.jar }}"
          PORTABLE="dist/BiliBili_Danmuji_${VERSION}_portable"
          mkdir -p "${PORTABLE}"

          cp "${JAR}" "${PORTABLE}/"
          cp -r dist/jre "${PORTABLE}/jre"

          # Windows 启动脚本 (使用自带 JRE)
          cat > "${PORTABLE}/run.bat" << 'BATEOF'
          @echo off
          title BiliBili_Danmuji
          jre\bin\java -jar -Xms64m -Xmx128m BiliBili_Danmuji-*.jar --server.port=23333
          pause
          BATEOF

          # Linux/Mac 启动脚本 (使用自带 JRE)
          cat > "${PORTABLE}/run.sh" << 'SHEOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          "${DIR}"/jre/bin/java -jar -Xms64m -Xmx128m "${DIR}"/BiliBili_Danmuji-*.jar --server.port=23333
          SHEOF
          chmod +x "${PORTABLE}/run.sh"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili_Danmuji-${{ steps.version.outputs.version }}.jar
          path: ${{ steps.jdeps.outputs.jar }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili_Danmuji_${{ steps.version.outputs.version }}
          path: dist/BiliBili_Danmuji_${{ steps.version.outputs.version }}/

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliBili_Danmuji_${{ steps.version.outputs.version }}_portable
          path: dist/BiliBili_Danmuji_${{ steps.version.outputs.version }}_portable/
