<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head(pageCss='settings.css', pageTitle='弹幕姬-基本设置')}"></th:block>
</head>
<body>
<div class="app">
    <div class="row align-items-center justify-content-center center-wrapper">
        <div class="col-md-12 card-outer-wrap">
            <div class="card border-primary">
                <div class="card-header">
                    <h2>
                        <span>BiLiBiLi Living 欢迎,关注,送礼,弹幕的,拉黑,查看</span>
                        <span style="float:right;font-size:13px;color:#888;font-weight:normal;line-height:2.2;" th:if="${BUILD_TIME} != ''" th:text="'Build: ' + ${BUILD_TIME}"></span>
                    </h2>
                </div>
                <div class="card-body p-1 pt-0">
                    <th:block th:replace="~{fragments/layout :: status-bar}"></th:block>
                    <th:block th:replace="~{fragments/layout :: sidebar(activePage='settings')}"></th:block>
                    <!-- 内容面板 -->
                    <div class="settings-content flex-grow-1">
                        <div class="tab-pane" th:classappend="${! #arrays.isEmpty(param.tab) && param.tab[0] == 'room-set'} ? 'active' : ''" id="tab-room-set">
                            <div class="input-group mb-1"><h5>房间设置</h5></div>
                            <!-- 房间连接栏 -->
                            <div class="card border-primary mb-3" th:if="${ROOMID}!=null and ${ROOM_INFO}!=null">
                                <div class="card-body py-2 px-3">
                                    <div class="row g-2 align-items-center">
                                        <div class="col-auto"><img th:src="${ROOM_INFO.cover}" alt="封面" style="width:72px;height:45px;object-fit:cover;border-radius:4px;" onerror="this.style.display='none'"></div>
                                        <div class="col" style="min-width:0;">
                                            <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" th:text="${ROOM_INFO.title}"></div>
                                            <div style="font-size:12px;color:#888;">
                                                主播：<span th:text="${ANAME}"></span><span style="margin:0 8px;">|</span>房间：<a class="window-open-x" th:text="${ROOMID}" th:href="@{'https://live.bilibili.com/'+${ROOMID}}" target="_blank" style="text-decoration:none;"></a>
                                                <span style="margin:0 8px;" th:if="${ROOM_INFO.area_name} != null">|</span><span th:if="${ROOM_INFO.area_name} != null" th:text="${ROOM_INFO.parent_area_name} + '·' + ${ROOM_INFO.area_name}"></span>
                                            </div>
                                            <div style="font-size:12px;margin-top:2px;">
                                                <span th:if="${LIVE_STATUS}==1" style="color:#4eff4e;">●直播中</span>
                                                <span th:if="${LIVE_STATUS}!=1" style="color:#ff6b6b;">●未开播</span>
                                                <span style="color:#aaa;margin-left:8px;" th:if="${ROOM_INFO.live_start_time} != null and ${ROOM_INFO.live_start_time} > 0">开播：<span th:text="${#dates.format(new java.util.Date(ROOM_INFO.live_start_time * 1000), 'MM-dd HH:mm')}"></span></span>
                                                <span style="color:#aaa;margin-left:8px;">人气：<span th:text="${POPU}">-</span></span>
                                                <span style="color:#aaa;margin-left:8px;">看过：<span th:text="${ROOM_WATCHER}">-</span></span>
                                            </div>
                                        </div>
                                        <div class="col-auto text-end">
                                            <div class="input-group input-group-sm mb-1" style="width:280px;">
                                                <span class="input-group-text" style="font-size:12px;">房间号</span>
                                                <input type="number" id="room_id" class="form-control" placeholder="输入房间号" min="1" style="ime-mode:Disabled;font-size:12px;" onKeypress="return (/[\d]/.test(String.fromCharCode(event.keyCode)))" th:value="${ROOMID}!=null?${ROOMID}:${HROOMID}">
                                                <button type="button" class="btn btn-info btn-sm" id="connect">加载中</button>
                                            </div>
                                            <div class="input-group input-group-sm" style="width:280px;" th:if="${ROOMID}!=null" id="web-danmu-show">
                                                <input class="form-control connect-docket" data-bs-html="true" data-bs-placement="top" data-bs-toggle="tooltip" placeholder="弹幕WS地址" title="网页弹幕WebSocket地址" style="font-size:11px;" th:value="''">
                                                <button class="btn btn-outline-primary btn-sm btn-connect-d" type="button">弹幕</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 未连接状态 -->
                            <div class="card border-secondary mb-3" th:if="${ROOMID}==null">
                                <div class="card-body py-3 px-3 text-center">
                                    <div style="color:#999;margin-bottom:8px;">未连接到任何房间</div>
                                    <div class="input-group input-group-sm mx-auto" style="max-width:380px;">
                                        <span class="input-group-text">房间号</span>
                                        <input type="number" id="room_id" class="form-control" placeholder="输入要连接的B站直播间房间号" min="1" style="ime-mode:Disabled;" onKeypress="return (/[\d]/.test(String.fromCharCode(event.keyCode)))" th:value="${HROOMID}">
                                        <button type="button" class="btn btn-primary btn-sm" id="connect">加载中</button>
                                    </div>
                                </div>
                            </div>
                            <!-- 关注直播间列表 -->
                            <div class="watched-rooms-section mt-3" th:data-current-roomid="${ROOMID}">
                                <div class="input-group mb-1"><h5>关注直播间</h5></div>
                                <div class="row align-items-center mb-2" style="--bs-gutter-x:5px">
                                    <div class="col-auto"><input type="number" id="watched-room-input" class="form-control form-control-sm" placeholder="输入房间号" style="width:160px;" min="1"></div>
                                    <div class="col-auto"><button class="btn btn-sm btn-success" id="watched-room-add-btn">添加</button></div>
                                    <div class="col-auto"><button class="btn btn-sm btn-outline-info" id="watched-refresh-btn" title="刷新未连接直播间的状态和在线人数">刷新</button></div>
                                    <div class="col-auto"><span id="watched-room-add-msg" style="font-size:12px;"></span></div>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-sm table-striped" id="watched-rooms-table" style="display:none;">
                                        <thead><tr>
                                            <th data-sort="anchorName" style="cursor:pointer;">主播<span class="sort-arrow"></span></th>
                                            <th data-sort="roomName" style="cursor:pointer;">房间名<span class="sort-arrow"></span></th>
                                            <th data-sort="areaName" style="cursor:pointer;">分区<span class="sort-arrow"></span></th>
                                            <th data-sort="online" style="cursor:pointer;width:80px;text-align:right;">在线<span class="sort-arrow"></span></th>
                                            <th data-sort="liveStatus" style="cursor:pointer;width:80px;text-align:right;">状态<span class="sort-arrow"></span></th>
                                            <th style="width:80px;text-align:right;">连接</th>
                                            <th style="width:80px;text-align:right;">删除</th>
                                        </tr></thead>
                                        <tbody id="watched-rooms-tbody"></tbody>
                                    </table>
                                    <div id="watched-rooms-pagination" class="d-flex justify-content-between align-items-center mt-2" style="display:none;">
                                        <button class="btn btn-sm btn-outline-secondary" id="watched-prev-btn">上一页</button>
                                        <span id="watched-page-info" style="font-size:12px;color:#888;"></span>
                                        <button class="btn btn-sm btn-outline-secondary" id="watched-next-btn">下一页</button>
                                    </div>
                                </div>
                                <div id="watched-rooms-empty" class="text-muted" style="font-size:12px;">暂无关注直播间，输入房间号添加</div>
                            </div>
                        </div>
                        <div class="tab-pane" th:classappend="${#arrays.isEmpty(param.tab) || param.tab[0] == 'common-set' || param.tab[0] == 'cmd-set' || param.tab[0] == 'account-set'} ? 'active' : ''" id="tab-common-set">
                            <div class="input-group mb-1"><h5>账号设置</h5></div>
                            <div class="account-set">
                                <ul class="ps-1">
                                    <li class="ps-1 py-1"><a data-bs-toggle="collapse" data-target="#custom-cookie" href="#custom-cookie">自定义cookie</a></li>
                                    <li class="ps-1 py-1 collapse" id="custom-cookie">
                                        <div class="input-group">
                                            <input type="text" id="cookie_data" class="form-control" placeholder="自定义cookie" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-html="true" title="B站的cookie,通常在浏览器按f12找某个接口复制<br>必要:<span class='red-font'>bili_jct,SESSDATA</span>">
                                            <button type="button" class="btn btn-success" id="cookie_set_send">设定</button>
                                        </div>
                                    </li>
                                    <li class="unlogin ps-1 py-1" th:if="!(${USER}?exists)">你还没有登陆，<a th:href="@{/login}">去扫码</a>，或去<a th:href="@{/cookie_set}">自定义cookie</a></li>
                                    <li class="logined ps-1 py-1" th:if="${USER}?exists">用户名：<a class="user-name window-open-x" th:href="@{'https://space.bilibili.com/'+${USER.uid}}" th:text="${USER.uname}" target="_blank"></a></li>
                                    <li class="logined ps-1 py-1" th:if="${USER}?exists">uid：<span class="user-id" th:text="${USER.uid}"></span></li>
                                    <li class="logined ps-1 py-1" th:if="${USER}?exists"><a th:href="@{/quit}">退出登录</a></li>
                                </ul>
                            </div>
                            <div class="input-group mb-1"><h5>通用设置</h5></div>
                            <div class="row input-group mb-3 common-set" id="common-set">
                                <div class="col-auto"><label class="form-check-label"><input class="form-check-input auto_save_set" type="checkbox"><span class="_description" data-bs-html="true" data-bs-placement="top" data-bs-toggle="tooltip" title="是否自动保存配置，<span class='red-font'>每修改一次触发保存</span>">自动保存</span></label></div>
                                <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_autoStart live-save" type="checkbox"><span class="_description" data-bs-html="true" data-bs-placement="top" data-bs-toggle="tooltip" title="是否开启下次自动连接上次连接的房间，<span class='red-font'>开启该设置下次启动弹幕姬将会自动连接最后一次连接的房间</span>">自动连接</span></label></div>
                                <div class="col-auto"><label class="form-check-label"><input class="form-check-input win_auto_openSet live-save" type="checkbox"><span class="_description" data-bs-html="true" data-bs-placement="top" data-bs-toggle="tooltip" title="mac/window系统下是否开启自动打开web网页配置页面，<span class='red-font'>开启该设置下次启动弹幕姬将会自动使用系统默认浏览器打开web网页配置页面</span>">设置页面</span></label></div>
                                <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_log live-save" type="checkbox"><span class="_description" data-bs-html="true" data-bs-placement="top" data-bs-toggle="tooltip" title="弹幕是否保存本地<br/>本地弹幕文件夹位置：<br/>本项目根目录下Danmuji_log文件夹">弹幕记录</span></label></div>
                                <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_watcher_log live-save" type="checkbox"><span class="_description" data-bs-html="true" data-bs-placement="top" data-bs-toggle="tooltip" title="进入直播间的观众信息是否保存本地<br/>文件位置：本项目根目录下Danmuji_log文件夹<br/>文件命名：日期(房间号)viewers.txt<br/>记录格式：时间戳, 用户名, uid, 空间链接, 附加信息">观众记录</span></label></div>
                            </div>
                            <div class="input-group mb-1"><h5>显示设置</h5></div>
                            <div class="row input-group mb-3 cmd-set" id="cmd-set">
                                <div class="input-group mb-1"><h6>主要显示</h6></div>
                                <div class="row input-group mb-3"><div class="col-auto"><label class="form-check-label"><input class="form-check-input is_cmd live-save" type="checkbox"><span class="_description" data-bs-html="true" data-bs-placement="top" data-bs-toggle="tooltip" title="cmd控制台是否显示">控制台</span></label></div></div>
                                <div class="input-group mb-1"><h6>弹幕显示</h6></div>
                                <div class="row input-group mb-3">
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_barrage live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="是否显示弹幕">弹幕</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_barrage_guard live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="弹幕是否显示舰长图标">舰长</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_barrage_vip live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="弹幕是否显示老爷图标">老爷</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_barrage_manager live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="弹幕是否显示房管主播图标">房管</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_barrage_medal live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="弹幕是否显示勋章图标">勋章</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_barrage_ul live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="弹幕是否显示用户UL等级图标">等级</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_barrage_anchor_shield live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="弹幕是否屏蔽非佩戴连接房间勋章的用户">勋章屏蔽</span></label></div>
                                </div>
                                <div class="input-group mb-1"><h6>礼物显示</h6></div>
                                <div class="row input-group mb-3">
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_gift live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="是否显示礼物消息">礼物</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_gift_free live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="是否显示免费礼物消息">免费</span></label></div>
                                </div>
                                <div class="input-group mb-1"><h6>其他显示</h6></div>
                                <div class="row input-group mb-3">
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_block live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="是否显示房管禁言消息">禁言</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_welcome live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="是否显示欢迎老爷舰长进入直播间消息">欢迎</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_welcome_all live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="是否显示用户进入直播间消息">进入</span></label></div>
                                    <div class="col-auto"><label class="form-check-label"><input class="form-check-input is_follow live-save" type="checkbox"><span class="_description" data-bs-placement="top" data-bs-toggle="tooltip" title="是否显示关注消息">关注</span></label></div>
                                </div>
                            </div>
                            <div class="input-group mb-3 set-control">
                                <div class="col-auto">
                                    <input class="import-file-input" style="display: none;" type="file" value="上传文件"/>
                                    <button class="btn btn-warning export-set" title="导出设置到本地，弹幕姬配置文件夹set底下" type="button">导出设置</button>
                                    <button class="btn btn-success export-set-web" title="网页实时下载配置" type="button">下载设置</button>
                                    <button class="btn btn-info import-set" title="导入配置文件" type="button">导入设置</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div></div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: shared-modals}"></th:block>
<th:block th:replace="~{fragments/layout :: toast-and-save(page='settings')}"></th:block>
<script th:src="@{/js/common.js}" type="text/javascript"></script>
<script th:src="@{/js/settings.js}" type="text/javascript"></script>
<th:block th:replace="~{fragments/layout :: inline-scripts(page='settings')}"></th:block>
</body>
</html>
