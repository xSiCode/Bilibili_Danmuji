<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="head(pageCss, pageTitle)">
    <meta charset="utf-8">
    <meta content="never" name="referrer">
    <meta content="webkit" name="renderer">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport">
    <title th:text="${pageTitle} != null ? ${pageTitle} : '弹幕姬-主页'">弹幕姬-主页</title>
    <link href="../../img/headlogo.png" rel="apple-touch-icon-precomposed" th:href="@{/img/favicon.png}">
    <link href="../../img/headlogo.png" rel="shortcut icon" th:href="@{/img/favicon.png}">
    <link href="../../css/bootstrap.min.css" media="all" rel="stylesheet" th:href="@{/css/bootstrap.min.css}" type="text/css">
    <link href="../../css/common.css" media="all" rel="stylesheet" th:href="@{/css/common.css}" type="text/css">
    <th:block th:if="${pageCss != null}">
        <link href="../../css/settings.css" media="all" rel="stylesheet" th:href="@{'/css/' + ${pageCss}}" type="text/css">
    </th:block>
    <script src="../../js/jquery-3.7.0.min.js" th:src="@{/js/jquery-3.7.0.min.js}" type="text/javascript"></script>
    <script src="../../js/popper.min.js" th:src="@{/js/popper.min.js}" type="text/javascript"></script>
    <script src="../../js/bootstrap.min.js" th:src="@{/js/bootstrap.min.js}" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
</th:block>
</html>
