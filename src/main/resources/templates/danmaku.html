<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: head(pageCss='danmaku.css', pageTitle='弹幕姬-弹幕')}"></th:block>
</head>
<body>
<div class="app">
    <div class="row align-items-center justify-content-center center-wrapper">
        <div class="col-md-12 card-outer-wrap">
            <div class="card border-primary">
                <div class="card-header"><h2><span>BiLiBiLi Living 欢迎,关注,送礼,弹幕的,拉黑,查看</span><span style="float:right;font-size:13px;color:#888;font-weight:normal;line-height:2.2;" th:if="${BUILD_TIME} != ''" th:text="'Build: ' + ${BUILD_TIME}"></span></h2></div>
                <div class="card-body p-1 pt-0">
                    <th:block th:replace="~{fragments/layout :: status-bar}"></th:block>
                    <th:block th:replace="~{fragments/layout :: sidebar(activePage='danmaku')}"></th:block>
                    <div class="settings-content flex-grow-1">
                        <!-- 话术姬 -->
                        <div class="tab-pane" th:classappend="${#arrays.isEmpty(param.tab) || param.tab[0] == 'danmakuStore-set'} ? 'active' : ''" id="tab-danmakuStore-set">
                            <div class="input-group mb-1"><h5>话术姬</h5></div>
                            <div class="input-group mb-3 danmakuStore-set" id="danmakuStore-set">
                                <div class="header-set">
                                    <div class="row align-items-center" style="margin-bottom:5px;--bs-gutter-x:5px">
                                        <div class="col-auto"><button class="btn btn-sm btn-success danmakuStore-add-btn">添加</button></div>
                                        <div class="col-auto"><button class="btn btn-sm btn-info danmakuStore-sort-btn">按类型排序</button></div>
                                    </div>
                                    <div class="danmakuStore-list"><ul class="danmakuStore-ul list-unstyled mb-0" id="danmakuStore-ul"></ul></div>
                                </div>
                            </div>
                            <div class="input-group mb-3 set-control" data-file="ds">
                                <div class="col-auto">
                                    <input class="import-file-input" style="display: none;" type="file" value="上传文件"/>
                                    <button class="btn btn-warning export-set" title="导出设置到本地，弹幕姬配置文件夹set底下" type="button">导出</button>
                                    <button class="btn btn-success export-set-web" title="网页实时下载配置" type="button">下载</button>
                                    <button class="btn btn-info import-set" title="导入配置文件" type="button">导入"话术.json"</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div></div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: shared-modals}"></th:block>
<th:block th:replace="~{fragments/layout :: toast-and-save(page='danmaku')}"></th:block>
<script th:src="@{/js/common.js}" type="text/javascript"></script>
<script th:src="@{/js/danmaku.js}" type="text/javascript"></script>
<th:block th:replace="~{fragments/layout :: inline-scripts(page='danmaku')}"></th:block>
</body>
</html>
