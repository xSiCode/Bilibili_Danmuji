---
spring:
  #开放spring完全循环构造引入
  main:
    allow-circular-references: true
  thymeleaf:
  prefix : classpath:/templates/
  suffix : .html
  cache: false
  encoding: UTF-8
  mode: HTML5
  mvc:
    static-path-pattern: /**
    resources:
      chain:
        strategy:
          content:
            paths: /**
            enabled: true
      static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/
server:
#  port: ${PORT:5000}
  port: 21212
  servlet:
    encoding:
      force: true
      charset: UTF-8
      enabled: true

danmuji:
  version: 2.7.0.6
  log:
    # 日志文件根目录。留空=系统 Documents/Danmuji_log（默认）
    # 多开程序时所有实例共用同一目录，历史数据自动延续
    # 也可指定绝对路径如: D:\Danmuji_log
    dir: